<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Lot G : icones des ecrans d'accueil (Android, iOS) et manifeste,
         qui permet d'installer StudyAI comme une application. Les balises
         de partage et les donnees structurees sont ajoutees a la
         construction (vite.config.ts, src/lib/referencement.ts). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      DEUX POLICES, ET LA PREMIERE N'ETAIT PAS CHARGEE.

      La feuille de style demandait « Inter » depuis le premier jour sans que
      personne ne la serve : mesure au banc dans le navigateur, une chaine
      rendue en `Inter, serif` faisait exactement la meme largeur qu'en
      `serif` seul — la famille n'existait nulle part et tout retombait sur
      Segoe UI. Toute l'echelle typographique avait donc ete reglee sur une
      police choisie par accident, differente d'une machine a l'autre.

      Bricolage Grotesque porte les titres. C'est le quatrieme point du
      diagnostic de la premiere passe : le caractere typographique vient
      presque toujours d'un second caractere reserve aux titres.

      `display=swap` : le texte s'affiche tout de suite dans la police de
      repli et bascule a l'arrivee. Sans lui, un reseau lent laisserait la
      page muette — inacceptable en demonstration.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- NON BLOQUANTE (lot H, audit Lighthouse) : chargee comme feuille
         « print » puis basculee sur tous les ecrans a son arrivee. La page
         s'affiche sans l'attendre — `display=swap` garantissait deja un
         texte lisible, la feuille elle-meme retardait encore le premier
         affichage de pres d'une seconde sur mobile. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400..700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400..700&display=swap"
      />
    </noscript>
    <meta name="theme-color" content="#c8102e" />

    <title>StudyAI — résumez, révisez, interrogez vos cours</title>
    <meta
      name="description"
      content="Importez un cours : StudyAI le résume, génère un quiz pour vous auto-évaluer et répond à vos questions en s'appuyant uniquement sur son contenu."
    />
  </head>
  <body>
    <!-- Sans JavaScript, la page restait blanche : un robot qui n'execute
         pas les scripts, ou un navigateur qui les bloque, n'y lisait rien. -->
    <noscript>
      <p style="font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.5">
        <strong>StudyAI</strong> résume vos cours, génère des quiz sourcés et répond à vos
        questions en s’appuyant uniquement sur leur contenu. L’application a besoin de
        JavaScript : activez-le dans votre navigateur pour l’utiliser.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
