# Hebergement de StudyAI sur Render — palier gratuit.
#
# Deux services decrits ici, une seule base : Supabase, deja en ligne et deja
# migree. Le deploiement NE LANCE AUCUNE MIGRATION, a dessein : c'est une
# operation que l'equipe veut garder en main (docs/AGENTS.md, section 6).
#
# AUCUN SECRET DANS CE FICHIER. Les valeurs marquees « sync: false » sont
# demandees par Render a la creation, et saisies dans son tableau de bord.
#
# Limite connue du palier gratuit : le serveur s'endort apres une periode
# d'inactivite et met une trentaine de secondes a se reveiller. La
# demonstration de soutenance se fait donc en local (docs/DEMO-VEILLE.md).

services:
  # --- API : FastAPI -----------------------------------------------------------
  - type: web
    name: studyai-api
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    # $PORT est fourni par Render ; 0.0.0.0 pour accepter les connexions
    # exterieures au conteneur.
    startCommand: uvicorn app.main:application --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # 3.12 : la version que l'integration continue exerce a chaque poussee.
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      # Genere par Render. Distinct du secret local : un jeton emis en local
      # n'ouvre pas la version en ligne, et inversement.
      - key: JWT_SECRET
        generateValue: true
      # A saisir dans le tableau de bord.
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # L'adresse publique du front, avec https:// et sans barre finale, par
      # exemple https://studyai-web.onrender.com. Le serveur n'accepte qu'une
      # origine : sans elle, le navigateur est refuse (CORS).
      - key: CLIENT_ORIGIN
        sync: false

  # --- Front : React, en site statique --------------------------------------
  - type: web
    name: studyai-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      # L'adresse publique de l'API, suivie de /api, par exemple
      # https://studyai-api.onrender.com/api. Lue au moment de la construction :
      # la changer demande de reconstruire le front.
      - key: VITE_API_URL
        sync: false
    # Sans cette regle, rafraichir une page comme /cours/... renvoie une
    # erreur 404 : le serveur statique ne connait que les fichiers, pas les
    # routes de React. Toute adresse inconnue est servie par index.html, et
    # React Router prend le relais.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # En-tetes HTTP (lot H, 20 octobre).
    # - /assets/* : noms haches par Vite (index-1EfRJDMo.css). Un fichier
    #   modifie change de nom : on peut donc le garder un an sans risque.
    # - index.html, lui, doit etre revalide a chaque visite, sinon un
    #   navigateur garderait l'ancienne version apres un deploiement.
    # - Trois en-tetes de securite sans effet sur le fonctionnement. PAS de
    #   Content-Security-Policy : mal reglee, elle bloquerait les polices
    #   Google ou l'API, et casserait le site.
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
