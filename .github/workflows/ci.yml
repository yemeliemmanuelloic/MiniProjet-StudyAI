name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: server

      # Aucun appel reel au fournisseur de modele en CI : les tests portent sur
      # l'anonymisation et le decoupage, qui sont deterministes et hors reseau.
      # Sinon la CI devient lente, couteuse et instable.
      - name: Tests
        run: python -m pytest tests -q
        working-directory: server

      # Verifie que l'application se cable entierement — routes, dependances,
      # modeles de reponse — sans base de donnees ni clef d'API.
      - name: Verification du cablage
        run: python -c "from app.main import application; assert len(application.openapi()['paths']) >= 14"
        working-directory: server
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
          JWT_SECRET: valeur-de-test-pour-la-ci

      # La migration doit produire du SQL valide sans se connecter.
      - name: Migration (mode hors ligne)
        run: python -m alembic upgrade head --sql > /dev/null
        working-directory: server
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
          JWT_SECRET: valeur-de-test-pour-la-ci

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: client/package-lock.json }
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
