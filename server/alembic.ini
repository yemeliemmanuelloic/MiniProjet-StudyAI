; Migrations Alembic — remplace `prisma migrate`.
;
; L'URL de connexion n'est volontairement PAS ecrite ici : elle est lue depuis
; .env par alembic/env.py, qui utilise DIRECT_URL (pooler de sessions, port
; 5432). Le pooler de transactions du port 6543 ne supporte pas les
; instructions DDL d'une migration.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
